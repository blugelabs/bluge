version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gochecknoinits
    - goconst
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nolintlint
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace

  settings:
    dupl:
      threshold: 100
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
    gocyclo:
      min-complexity: 20
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
    govet:
      enable:
        - shadow
    lll:
      line-length: 140
      tab-width: 4
    misspell:
      locale: US
    nolintlint:
      allow-no-explanation:
        - lll
        - funlen
      require-specific: false

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      # Test files - relax many rules
      - path: _test\.go
        linters:
          - mnd
          - lll
          - funlen
          - goconst
          - gocyclo
          - dupl
          - gochecknoinits
          - gocritic
          - gosec
          - errcheck

      # CLI commands can use init
      - path: cmd/bluge/cmd
        linters:
          - gochecknoinits

      # sizes.go needs init
      - path: sizes.go
        linters:
          - gochecknoinits

      # Cannot safely refactor until optimization tests are in place
      - path: index/optimize.go
        linters:
          - funlen

      # FIXME refactor persister
      - path: index/persister.go
        linters:
          - funlen
        text: persisterLoop

      # Analysis tests have non-english words and duplicate code
      - path: ^analysis/.*_test\.go$
        linters:
          - misspell
          - dupl

      # Language analyzers have non-english words and unicode
      - path: ^analysis/lang/.*\.go$
        linters:
          - misspell
          - dupl
          - mnd
          - gocyclo
          - funlen
          - gocritic
          - staticcheck

      # Allow init in specific files
      - path: analysis/lang/in/scripts.go
        linters:
          - gochecknoinits

      - path: analysis/freq.go
        linters:
          - gochecknoinits

      - path: search/searcher/search_fuzzy.go
        linters:
          - gochecknoinits

      # Has long regexp
      - path: analysis/tokenizer/web.go
        linters:
          - lll

      # Needs rewrite to avoid fallthrough
      - path: analysis/char/asciifolding.go
        linters:
          - gocritic
          - funlen
          - gocyclo

      # Many hard-coded values
      - path: numeric/geo/sloppy.go
        linters:
          - mnd
          - gochecknoinits

      - path: numeric/prefix_coded.go
        linters:
          - mnd

      # Allow init methods for size calculations
      - path: size.go
        linters:
          - gochecknoinits

      # Embedded segment package - code from ice
      - path: index/segment/
        linters:
          - funlen
          - gocyclo
          - dupl
          - goconst
          - gochecknoinits
          - lll
          - mnd
          - gocritic
          - unparam
          - errcheck
          - dogsled
          - unused
          - whitespace
          - nakedret
          - staticcheck
          - gosec
          - govet

      # Benchmark command has long functions
      - path: cmd/bluge/cmd/benchmark
        linters:
          - funlen
          - errcheck
          - goconst
          - unparam
          - gosec
          - lll
          - unconvert
          - gochecknoinits
          - govet
          - gocyclo
          - misspell

      # segment CLI commands
      - path: cmd/bluge/cmd/segment
        linters:
          - lll
          - gosec

      # Pre-existing staticcheck suggestions - address in separate PR
      - path: search/searcher/
        linters:
          - staticcheck
        text: "S1001"

      - path: index/
        linters:
          - staticcheck
        text: "QF"

      - path: numeric/
        linters:
          - staticcheck
        text: "QF"

      - path: analysis/token/
        linters:
          - staticcheck
        text: "QF"

      # Pre-existing gosec issues
      - path: index/
        linters:
          - gosec
        text: "G115|G304"

      - path: numeric/
        linters:
          - gosec
        text: "G115"

      - path: search/
        linters:
          - gosec
        text: "G115"

      # Pre-existing nakedret
      - path: index/writer.go
        linters:
          - nakedret

      # Pre-existing gocyclo
      - path: index/
        linters:
          - gocyclo

      # Pre-existing gosec in root package
      - path: ^field\.go$
        linters:
          - gosec
        text: "G115"

      - path: ^search\.go$
        linters:
          - gosec
        text: "G115"

      # Pre-existing gofmt issues (need separate PR to fix)
      - path: analysis/token/camelcase\.go$
        linters:
          - gofmt

      - path: search/searcher/search_geo
        linters:
          - gofmt

    paths:
      - test/testdata_etc
      - internal/cache
      - internal/renameio
      - internal/robustio

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
  tests: true
